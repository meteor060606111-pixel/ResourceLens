name: macOS build and release

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'frontend/**'
      - 'go.mod'
      - 'go.sum'
      - 'build-macos.sh'
      - 'installer/macos/**'
      - 'video-engine/**'
      - '.github/workflows/macos.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build, test, sign and package
        env:
          RESOURCELENS_ARCH: ${{ matrix.arch }}
        run: bash ./build-macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            release/macos-${{ matrix.arch }}/*.dmg
            release/macos-${{ matrix.arch }}/*.sha256
          if-no-files-found: error

  windows-compatibility:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Check existing Windows implementation
        shell: pwsh
        run: |
          npm ci --prefix frontend --ignore-scripts
          npm run build --prefix frontend
          go test -tags 'desktop,production' ./app ./frontend
          go vet -tags 'desktop,production' ./app ./frontend
          go build -tags 'desktop,production' -o release/ResourceLens.exe ./app

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [macos, windows-compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: macos-*
          path: release-assets
          merge-multiple: true
      - name: Publish versioned macOS installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^const appVersion = "\(.*\)"/\1/p' app/features.go)
          tag="v${version}-macos"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump appVersion to publish another release."
            exit 0
          fi
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "拾流 ResourceLens ${version} · macOS" --notes-file installer/macos/RELEASE.md --latest=false
          gh release upload "$tag" release-assets/*.dmg release-assets/*.sha256
          gh release edit "$tag" --draft=false --latest=false
